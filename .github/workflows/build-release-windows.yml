name: "Build Windows Wails"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    branches:
      - amadeus
    paths:
      - 'gui-wails/**'
      - 'Windows/**'
      - '.github/workflows/build-release-windows.yml'
  watch:
    types: [started]

permissions:
  contents: write

jobs:
  # ── Linux job: cross-compile ProxyBridgeCore.dll only ──────────────────────
  build-dll:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64

      - name: Download WinDivert
        run: |
          curl -sL "https://github.com/basil00/Divert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip" -o /tmp/WinDivert.zip
          unzip -q /tmp/WinDivert.zip -d /tmp/WinDivert
          ls /tmp/WinDivert/WinDivert-2.2.2-A/x64/

      - name: Create WinDivert.def (manual, from header)
        run: |
          printf '%s\n' 'LIBRARY WinDivert.dll' 'EXPORTS' \
            'WinDivertOpen' 'WinDivertClose' 'WinDivertSend' 'WinDivertRecv' \
            'WinDivertRecvEx' 'WinDivertSendEx' 'WinDivertSetParam' \
            'WinDivertGetParam' 'WinDivertHelperInit' 'WinDivertHelperHashPacket' \
            'WinDivertHelperParsePacket' 'WinDivertHelperUnparsePacket' \
            'WinDivertHelperCheckPacket' 'WinDivertHelperDecrypt' \
            'WinDivertHelperEncrypt' 'WinDivertHelperExtractTLV' \
            'WinDivertHelperInjectTLV' 'WinDivertHelperCalcChecksum' \
            'WinDivertHelperNTOH' 'WinDivertHelperHTON' \
            > /tmp/windivert.def
          echo "=== WinDivert.def created ==="
          cat /tmp/windivert.def

      - name: Build WinDivert import library
        run: |
          WIN=/tmp/WinDivert/WinDivert-2.2.2-A
          x86_64-w64-mingw32-dlltool \
            -d /tmp/windivert.def \
            -l /tmp/libWinDivert.a \
            -D WinDivert.dll
          ls -lh /tmp/libWinDivert.a

      - name: Build ProxyBridgeCore.dll (MinGW → Windows)
        run: |
          WIN=/tmp/WinDivert/WinDivert-2.2.2-A
          mkdir -p build-dll
          x86_64-w64-mingw32-gcc -shared -O2 -s -Wall \
            -D_WIN32_WINNT=0x0601 -DPROXYBRIDGE_EXPORTS \
            -I"$WIN/include" \
            Windows/src/ProxyBridge.c \
            -L/usr/x86_64-w64-mingw32/lib -lws2_32 -liphlpapi \
            -o build-dll/ProxyBridgeCore.dll
          echo "=== ProxyBridgeCore.dll ==="
          file build-dll/ProxyBridgeCore.dll
          ls -lh build-dll/

      - name: Create ProxyBridgeCore.def
        run: |
          # ProxyBridge.h is the source of truth for exported functions
          printf '%s\n' 'LIBRARY ProxyBridgeCore.dll' 'EXPORTS' \
            'ProxyBridge_Activate' 'ProxyBridge_Deactivate' \
            'ProxyBridge_SetLogCallback' 'ProxyBridge_SetConnectionCallback' \
            'ProxyBridge_SetProxyConfig' 'ProxyBridge_AddRule' \
            'ProxyBridge_EnableRule' 'ProxyBridge_DisableRule' \
            'ProxyBridge_EditRule' 'ProxyBridge_DeleteRule' \
            'ProxyBridge_GetRules' 'ProxyBridge_IsRunning' \
            'ProxyBridge_GetStats' 'ProxyBridge_GetUptime' \
            'ProxyBridge_TestConnection' \
            > build-dll/ProxyBridgeCore.def
          cat build-dll/ProxyBridgeCore.def

      - name: Build ProxyBridgeCore import library for Go cgo
        run: |
          x86_64-w64-mingw32-dlltool \
            -d build-dll/ProxyBridgeCore.def \
            -l build-dll/libProxyBridgeCore.a \
            -D ProxyBridgeCore.dll
          ls -lh build-dll/

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxybridge-dll-win
          path: build-dll/
          retention-days: 1

  # ── Windows job: build Wails GUI natively ───────────────────────────────────
  build-gui:
    runs-on: windows-latest
    needs: build-dll

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download DLL artifact from Linux job
        uses: actions/download-artifact@v4
        with:
          name: proxybridge-dll-win
          path: ./dll/

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-go

      - name: Add MSYS2 to PATH
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Go
        run: go version

      - name: Download WinDivert
        run: |
          $url = "https://github.com/basil00/Divert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip"
          Invoke-WebRequest -Uri $url -OutFile "WinDivert.zip"
          Expand-Archive -Path "WinDivert.zip" -DestinationPath "C:\" -Force
          Get-ChildItem "C:\WinDivert-2.2.2-A\x64"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy DLL to proxybridge package
        run: |
          Copy-Item "dll\ProxyBridgeCore.dll" "gui-wails\proxybridge-gui\proxybridge\" -Force
          Copy-Item "dll\libProxyBridgeCore.a" "gui-wails\proxybridge-gui\proxybridge\" -Force
          Copy-Item "dll\WinDivert.dll" "gui-wails\proxybridge-gui\proxybridge\" -Force
          New-Item -ItemType Directory -Force -Path "gui-wails\proxybridge-gui\proxybridge\WinDivert\include" | Out-Null
          Copy-Item "C:\WinDivert-2.2.2-A\include\*" "gui-wails\proxybridge-gui\proxybridge\WinDivert\include\" -Force
          Get-ChildItem "gui-wails\proxybridge-gui\proxybridge" -Recurse | Select-Object FullName

      - name: Build Wails GUI (Windows native)
        env:
          CGO_ENABLED: '1'
          CC: gcc
          CGO_LDFLAGS: -L${{ github.workspace }}/gui-wails/proxybridge-gui/proxybridge -lProxyBridgeCore -lWinDivert -lws2_32 -liphlpapi
          CGO_CFLAGS: -I${{ github.workspace }}/gui-wails/proxybridge-gui/proxybridge/WinDivert/include
        run: |
          cd gui-wails\proxybridge-gui
          wails build --platform windows/amd64 --outputname proxybridge-gui.exe

      - name: Verify exe
        run: |
          $exe = "gui-wails\proxybridge-gui\build\bin\proxybridge-gui.exe"
          if (-not (Test-Path $exe)) { throw "exe not found!" }
          Write-Host "exe: $((Get-Item $exe).Length / 1MB) MB"
          Get-ChildItem "gui-wails\proxybridge-gui\build\bin"

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxybridge-gui-exe
          path: gui-wails/proxybridge-gui/build/bin/proxybridge-gui.exe
          retention-days: 1

  # ── Package job: zip exe + DLLs + sys files, create release ───────────────
  package:
    runs-on: windows-latest
    needs: [build-dll, build-gui]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download exe
        uses: actions/download-artifact@v4
        with:
          name: proxybridge-gui-exe
          path: ./dist/

      - name: Download DLLs
        uses: actions/download-artifact@v4
        with:
          name: proxybridge-dll-win
          path: ./dll/

      - name: Download WinDivert
        run: |
          $url = "https://github.com/basil00/Divert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip"
          Invoke-WebRequest -Uri $url -OutFile "WinDivert.zip"
          Expand-Archive -Path "WinDivert.zip" -DestinationPath "C:\" -Force

      - name: Package zip
        run: |
          $outDir = "${{ github.workspace }}\build"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          # exe
          Copy-Item "dist\proxybridge-gui.exe" $outDir -Force

          # ProxyBridgeCore.dll (from Linux build)
          Copy-Item "dll\ProxyBridgeCore.dll" $outDir -Force

          # WinDivert runtime
          Copy-Item "C:\WinDivert-2.2.2-A\x64\WinDivert.dll" $outDir -Force
          Get-ChildItem "C:\WinDivert-2.2.2-A\x64\*.sys" | ForEach-Object {
            Copy-Item $_.FullName $outDir -Force
          }

          Write-Host "=== Final package contents ==="
          Get-ChildItem $outDir | ForEach-Object {
            Write-Host "  $($_.Name) ($($_.Length / 1MB) MB)"
          }

          # zip
          $zip = "${{ github.workspace }}\ProxyBridge-Windows.zip"
          Compress-Archive -Path "$outDir\*" -DestinationPath $zip -Force
          Write-Host "`nZip: $((Get-Item $zip).Length / 1MB) MB"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyBridge-Windows-zip
          path: ${{ github.workspace }}/ProxyBridge-Windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ inputs.tag }}
          name: "ProxyBridge Wails ${{ inputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ github.workspace }}/ProxyBridge-Windows.zip
