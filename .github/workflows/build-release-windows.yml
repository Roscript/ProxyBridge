name: Build & Release Windows (Wails)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    branches:
      - amadeus
    paths:
      - 'gui-wails/**'
      - 'Windows/**'
      - '.github/workflows/build-release-windows.yml'
  watch:
    types: [started]

permissions:
  contents: write

jobs:
  # ── Linux job: cross-compile DLL + Wails GUI for Windows ───────────────────
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install MinGW-w64 + NSIS (cross-compiler + packager for Windows)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 nsis

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('gui-wails/proxybridge-gui/frontend/package-lock.json') }}

      - name: Download WinDivert (for linking + headers)
        run: |
          curl -sL "https://github.com/basil00/Divert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip" -o /tmp/WinDivert.zip
          unzip -q /tmp/WinDivert.zip -d /tmp/WinDivert
          ls /tmp/WinDivert/WinDivert-2.2.2-A/x64/

      - name: Build WinDivert import library for MinGW
        run: |
          # WinDivert.zip has WinDivert.dll + WinDivert.lib but no .def
          # Use gendef (from mingw-w64) to generate .def from the DLL, then dlltool
          WIN=/tmp/WinDivert/WinDivert-2.2.2-A
          cd /tmp && x86_64-w64-mingw32-gendef "$WIN/x64/WinDivert.dll"
          x86_64-w64-mingw32-dlltool \
            -d /tmp/WinDivert.def \
            -l /tmp/libWinDivert.a \
            -D WinDivert.dll
          ls -lh /tmp/libWinDivert.a

      # --- Build ProxyBridgeCore.dll via MinGW cross-compile ---
      - name: Build ProxyBridgeCore.dll (MinGW → Windows)
        run: |
          set -e
          mkdir -p build-dll
          WIN=/tmp/WinDivert/WinDivert-2.2.2-A
          # Cross-compile ProxyBridgeCore.dll (dynamic link to WinDivert)
          x86_64-w64-mingw32-gcc -shared -O2 -s -Wall \
            -D_WIN32_WINNT=0x0601 -DPROXYBRIDGE_EXPORTS \
            -I"$WIN/include" \
            Windows/src/ProxyBridge.c \
            -L/usr/x86_64-w64-mingw32/lib -lws2_32 -liphlpapi \
            -o build-dll/ProxyBridgeCore.dll
          echo "=== ProxyBridgeCore.dll ==="
          file build-dll/ProxyBridgeCore.dll
          ls -lh build-dll/

      - name: Build ProxyBridgeCore import library for Go cgo
        run: |
          # Generate MinGW import library from the DLL we just built
          # First create a .def file from the DLL exports
          # Usegendef (from mingw-w64) to generate .def, then dlltool
          mkdir -p build-dll
          x86_64-w64-mingw32gendef build-dll/ProxyBridgeCore.dll 2>/dev/null || true
          if [ -f build-dll/ProxyBridgeCore.def ]; then
            x86_64-w64-mingw32-dlltool \
              -d build-dll/ProxyBridgeCore.def \
              -l build-dll/libProxyBridgeCore.a \
              -D ProxyBridgeCore.dll
            ls -lh build-dll/libProxyBridgeCore.a
          else
            # Fallback: create minimal import library
            echo "EXPORTS" > /tmp/pb.def
            x86_64-w64-mingw32-dlltool \
              -d /tmp/pb.def \
              -l build-dll/libProxyBridgeCore.a \
              -D ProxyBridgeCore.dll || true
            ls -lh build-dll/
          fi

      # --- Stage proxybridge package with DLL + import libs for Wails ---
      - name: Stage proxybridge package for Wails cross-compile
        run: |
          PKG=gui-wails/proxybridge-gui/proxybridge
          WIN=/tmp/WinDivert/WinDivert-2.2.2-A
          mkdir -p "$PKG/WinDivert/include" "$PKG"
          # Actual DLL and import library for cgo linking
          cp build-dll/ProxyBridgeCore.dll "$PKG/"
          cp /tmp/libWinDivert.a "$PKG/libWinDivert.a"
          # WinDivert runtime files (not for linking, for shipping)
          cp "$WIN/x64/WinDivert.dll" "$PKG/"
          cp "$WIN/x64/WinDivert32.sys" "$PKG/" 2>/dev/null || true
          cp "$WIN/x64/WinDivert64.sys" "$PKG/" 2>/dev/null || true
          # Headers
          cp -r "$WIN/include/"* "$PKG/WinDivert/include/" 2>/dev/null || true
          echo "=== proxybridge package ==="
          find "$PKG" -type f | sort

      - name: Build frontend
        run: |
          cd gui-wails/proxybridge-gui/frontend
          npm ci
          npm run build

      - name: Build Wails GUI (Linux → Windows cross-compile)
        env:
          CC: x86_64-w64-mingw32-gcc
          CGO_ENABLED: '1'
          GOOS: windows
          GOARCH: amd64
          CGO_LDFLAGS: '-LD:/a/ProxyBridge/ProxyBridge/gui-wails/proxybridge-gui/proxybridge -lProxyBridgeCore -lWinDivert -lws2_32 -liphlpapi'
          CGO_CFLAGS: '-ID:/a/ProxyBridge/ProxyBridge/gui-wails/proxybridge-gui/proxybridge/WinDivert/include'
        run: |
          cd gui-wails/proxybridge-gui
          wails build --platform windows/amd64 --outputname proxybridge-gui.exe

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxybridge-dll-win
          path: build-dll/
          retention-days: 1

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxybridge-gui-exe
          path: gui-wails/proxybridge-gui/build/bin/proxybridge-gui.exe
          retention-days: 1

  # ── Windows job: verify DLL, package zip, upload release ───────────────────
  package:
    runs-on: windows-latest
    needs: build-windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download exe from Linux job
        uses: actions/download-artifact@v4
        with:
          name: proxybridge-gui-exe
          path: ./dist/

      - name: Download DLL from Linux job
        uses: actions/download-artifact@v4
        with:
          name: proxybridge-dll-win
          path: ./dll-from-linux/

      - name: Setup MSYS2 (for MinGW gcc — rebuild DLL with full WinDivert)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Add MSYS2 to PATH
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download WinDivert
        run: |
          $url = "https://github.com/basil00/Divert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip"
          Invoke-WebRequest -Uri $url -OutFile "WinDivert.zip"
          Expand-Archive -Path "WinDivert.zip" -DestinationPath "C:\"

      - name: Verify exe from Linux build
        run: |
          $exe = "dist\proxybridge-gui.exe"
          if (-not (Test-Path $exe)) { throw "exe not found!" }
          Write-Host "  exe: $((Get-Item $exe).Length / 1MB) MB"

      - name: Build fresh ProxyBridgeCore.dll on Windows
        run: |
          $env:Path = "C:\msys64\mingw64\bin;" + $env:Path
          $wdir = "D:\a\ProxyBridge\ProxyBridge\Windows"
          New-Item -ItemType Directory -Force -Path "$wdir\output" | Out-Null
          gcc -shared -O2 -flto -s -Wall -D_WIN32_WINNT=0x0601 -DPROXYBRIDGE_EXPORTS `
            -I"C:\WinDivert-2.2.2-A\include" `
            "$wdir\src\ProxyBridge.c" `
            -L"C:\WinDivert-2.2.2-A\x64" -lWinDivert -lws2_32 -liphlpapi `
            -o "$wdir\output\ProxyBridgeCore.dll"
          Write-Host "=== DLL from Windows build ==="
          Get-ChildItem "$wdir\output"

      - name: Package zip (exe from Linux + DLL from Windows + WinDivert)
        run: |
          $outDir = "D:\a\ProxyBridge\ProxyBridge\build"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          # exe from Linux job
          Copy-Item "dist\proxybridge-gui.exe" $outDir -Force
          # DLL rebuilt on Windows (with real WinDivert)
          Copy-Item "D:\a\ProxyBridge\ProxyBridge\Windows\output\ProxyBridgeCore.dll" $outDir -Force
          # WinDivert runtime
          Copy-Item "C:\WinDivert-2.2.2-A\x64\WinDivert.dll" $outDir -Force
          Get-ChildItem "C:\WinDivert-2.2.2-A\x64\*.sys" | ForEach-Object {
            Copy-Item $_.FullName $outDir -Force
          }
          Write-Host "=== Final package contents ==="
          Get-ChildItem $outDir | ForEach-Object {
            Write-Host "  $($_.Name) ($($_.Length / 1MB) MB)"
          }
          # zip
          $zip = "D:\a\ProxyBridge\ProxyBridge\ProxyBridge-Windows.zip"
          Compress-Archive -Path "$outDir\*" -DestinationPath $zip -Force
          Write-Host "`nZip: $((Get-Item $zip).Length / 1MB) MB"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyBridge-Windows-zip
          path: D:\a\ProxyBridge\ProxyBridge\ProxyBridge-Windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ inputs.tag }}
          name: "ProxyBridge Wails ${{ inputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: D:\a\ProxyBridge\ProxyBridge\ProxyBridge-Windows.zip
