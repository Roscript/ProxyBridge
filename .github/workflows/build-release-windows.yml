name: Build & Release Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSYS2 (for GCC)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: |-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-toolchain

    - name: Add MSYS2 to PATH
      run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: pwsh

    - name: Install NSIS
      run: choco install nsis -y
      shell: pwsh

    - name: Install NSIS EnVar plugin
      run: |
        $nsisPluginDir = "C:\Program Files (x86)\NSIS\Plugins\x86-unicode"
        $url = "https://nsis.sourceforge.io/mediawiki/images/7/7f/EnVar_plugin.zip"
        Invoke-WebRequest -Uri $url -OutFile "EnVar.zip"
        Expand-Archive -Path "EnVar.zip" -DestinationPath "EnVar"
        Copy-Item "EnVar\Plugins\x86-unicode\EnVar.dll" -Destination $nsisPluginDir -Force
      shell: pwsh

    - name: Download WinDivert
      run: |
        $url = "https://github.com/basil00/Divert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip"
        Invoke-WebRequest -Uri $url -OutFile "WinDivert.zip"
        Expand-Archive -Path "WinDivert.zip" -DestinationPath "C:\"
      shell: pwsh

    - name: Build project
      run: |
        cd Windows
        .\compile.ps1 -NoSign -Compiler gcc
      shell: pwsh

    - name: List built files
      run: |
        Get-ChildItem Windows/output -Recurse | ForEach-Object {
          $size = [math]::Round($_.Length/1MB, 2)
          Write-Host "  $($_.Name) - $size MB"
        }
      shell: pwsh

    - name: Create GitHub Release
      id: create-release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag }}
        name: "ProxyBridge ${{ inputs.tag }}"
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          Windows/output/ProxyBridge-Setup-*.exe
          Windows/output/ProxyBridge-GUI-*.zip
          Windows/output/ProxyBridge-CLI-*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
